<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 Runner PRO</title>

<style>
body{
    margin:0;
    background:#0b1220;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:15px;
}

#ui{
    font-size:20px;
    margin-bottom:10px;
}

canvas{
    display:block;
    margin:auto;
    border:3px solid #334155;
    background:#87ceeb;
}

.info{
    margin-top:10px;
    color:#cbd5e1;
}
</style>
</head>
<body>

<h1>🏃 Endless Runner PRO</h1>

<div id="ui">
❤️ HP: <span id="hp">3</span>
|
🏆 Punkty: <span id="score">0</span>
|
⚡ Prędkość: <span id="speed">4</span>
</div>

<canvas id="game" width="900" height="350"></canvas>

<div class="info">
SPACE = Skok | SHIFT = Ślizg
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let hp = 3;
let score = 0;
let speed = 4;

const player = {
    x:100,
    y:250,
    width:30,
    height:50,
    velocityY:0,
    grounded:true,
    sliding:false
};

const obstacles = [];

function updateUI(){
    document.getElementById("hp").textContent = hp;
    document.getElementById("score").textContent = Math.floor(score);
    document.getElementById("speed").textContent = speed.toFixed(1);
}

function jump(){

    if(player.grounded){

        player.velocityY = -13;
        player.grounded = false;

    }
}

function slide(){

    if(player.sliding) return;

    player.sliding = true;

    setTimeout(()=>{
        player.sliding = false;
    },600);
}

document.addEventListener("keydown",(e)=>{

    if(e.code==="Space"){
        jump();
    }

    if(e.code==="ShiftLeft" || e.code==="ShiftRight"){
        slide();
    }

});

function spawnObstacle(){

    const rand = Math.random();

    let type = "block";

    if(rand > 0.7) type = "spike";
    if(rand > 0.9) type = "pit";

    obstacles.push({
        x: canvas.width + 50,
        type: type
    });
}

setInterval(spawnObstacle,1400);

function hitPlayer(){

    hp--;

    updateUI();

    if(hp <= 0){

        alert(
            "💀 Koniec gry!\n\nWynik: "
            + Math.floor(score)
        );

        location.reload();
    }
}

function update(){

    score += 0.1;
    speed += 0.001;

    player.velocityY += 0.65;
    player.y += player.velocityY;

    if(player.y >= 250){

        player.y = 250;
        player.velocityY = 0;
        player.grounded = true;

    }

    for(let i = obstacles.length-1; i >= 0; i--){

        const o = obstacles[i];

        o.x -= speed;

        const near =
            o.x < player.x + player.width &&
            o.x + 40 > player.x;

        if(o.type === "block"){

            if(
                near &&
                !player.sliding
            ){
                hitPlayer();
                obstacles.splice(i,1);
                continue;
            }
        }

        if(o.type === "spike"){

            if(
                near &&
                player.y > 220
            ){
                hitPlayer();
                obstacles.splice(i,1);
                continue;
            }
        }

        if(o.type === "pit"){

            if(
                near &&
                player.y >= 250
            ){
                hitPlayer();
                obstacles.splice(i,1);
                continue;
            }
        }

        if(o.x < -100){
            obstacles.splice(i,1);
        }
    }

    updateUI();
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // niebo
    ctx.fillStyle = "#87ceeb";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // ziemia
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(
        0,
        300,
        canvas.width,
        50
    );

    // przeszkody
    for(const o of obstacles){

        if(o.type==="block"){

            ctx.fillStyle="orange";

            ctx.fillRect(
                o.x,
                240,
                40,
                60
            );
        }

        else if(o.type==="spike"){

            ctx.fillStyle="red";

            ctx.beginPath();
            ctx.moveTo(o.x,300);
            ctx.lineTo(o.x+20,250);
            ctx.lineTo(o.x+40,300);
            ctx.fill();
        }

        else if(o.type==="pit"){

            ctx.fillStyle="black";

            ctx.fillRect(
                o.x,
                300,
                60,
                50
            );
        }

        // ostrzeżenie
        if(o.x > 750){

            ctx.fillStyle="yellow";
            ctx.font="24px Arial";

            if(o.type==="block")
                ctx.fillText("⬛",820,60);

            if(o.type==="spike")
                ctx.fillText("🔺",820,60);

            if(o.type==="pit")
                ctx.fillText("🕳️",820,60);
        }
    }

    // gracz
    ctx.fillStyle="cyan";

    if(player.sliding){

        ctx.fillRect(
            player.x,
            player.y+25,
            50,
            25
        );

    }else{

        ctx.fillRect(
            player.x,
            player.y,
            player.width,
            player.height
        );
    }
}

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(
        gameLoop
    );
}

updateUI();
gameLoop();

</script>
<a href="przegladarkowe.html">⬅ Powrót</a>
</body>
</html>
