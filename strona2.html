<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Instrukcja</title>

    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to bottom, rgb(30,0,0), rgb(0,0,0));
            color: white;
            text-align: center;
        }

        #top{
            background: red;
            padding: 25px;
            box-shadow: 0 0 20px red;
        }

        #top h1{
            margin: 0;
            font-size: 40px;
            letter-spacing: 2px;
        }

        #content{
            margin-top: 60px;
            padding: 20px;
        }

        .box{
            background: rgba(255,255,255,0.05);
            display: inline-block;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 20px black;
            max-width: 600px;
        }

        #back{
            display: inline-block;
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 25px;
            background: darkred;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            box-shadow: 0 0 15px red;
            transition: 0.3s;
        }

        #back:hover{
            transform: scale(1.1);
            background: red;
        }

        p{
            font-size: 20px;
            line-height: 1.6;
        }

    </style>

</head>
<body>

    <div id="top">
        <h1>Instrukcja uzywania</h1>
    </div>

        <div class="box">
            <h2>Kroki:</h2>
            

            <h4>instrukcja do wersji v2</h4>
            <p>
                
                1. Po zainstalowaniu apki.exe uruchom ją<br>
                2. Wpisz hasło: <b>"haslo"</b><br>
                3. Poczekaj na rezultaty <br>
                jezeli wpiszesz cos innego to program automatycznie zacznie klikać dany przycisk <br>
                jesl chesz mic sekwencje to wpisz np. 1,2,3,4,5,6
            </p>

        </div>

        <br>

        <a href="strona1.html" id="back">Powrót</a>
    </div>

</body>
</html>
