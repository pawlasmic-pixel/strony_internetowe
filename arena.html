<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>NEON SURVIVOR</title>

<style>
body{
margin:0;
background:#050816;
color:white;
font-family:Arial;
text-align:center;
}

canvas{
background:#0b1025;
display:block;
margin:auto;
border:2px solid #1e293b;
}

#ui{
padding:10px;
font-size:18px;
}
</style>
</head>
<body>

<h1>⚡ NEON SURVIVOR</h1>

<div id="ui">
HP: <span id="hp">100</span> |
LVL: <span id="lvl">1</span> |
XP: <span id="xp">0</span>
</div>

<canvas id="c" width="800" height="400"></canvas>

<p>WASD = ruch | unikaj i przetrwaj fale 👾</p>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

// PLAYER
let p={
x:400,y:200,
hp:100,
lvl:1,
xp:0,
cd:0
};

// ENEMIES
let enemies=[];

let keys={};

// INPUT
document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// MOVE
function move(){
if(keys["w"]) p.y-=3;
if(keys["s"]) p.y+=3;
if(keys["a"]) p.x-=3;
if(keys["d"]) p.x+=3;

p.x=Math.max(10,Math.min(790,p.x));
p.y=Math.max(10,Math.min(390,p.y));
}

// SPAWN ENEMY
function spawn(){
enemies.push({
x:Math.random()*800,
y:Math.random()*400,
hp:20 + p.lvl*5,
speed:1 + p.lvl*0.1
});
}

// PLAYER AUTO ATTACK
function attack(){

if(p.cd>0) return;
p.cd=20;

for(let e of enemies){
let d=Math.hypot(e.x-p.x,e.y-p.y);
if(d<120){
e.hp-=10;
}
}
}

// ENEMY AI
function enemyAI(e){
let dx=p.x-e.x;
let dy=p.y-e.y;
let d=Math.hypot(dx,dy)||1;

e.x+=dx/d*e.speed;
e.y+=dy/d*e.speed;

// damage player
if(d<18){
p.hp-=0.5;
}
}

// XP SYSTEM
function gainXP(){
p.xp++;

if(p.xp>100){
p.xp=0;
p.lvl++;
p.hp=100;
}
}

// LOOP
let tick=0;

function loop(){

ctx.clearRect(0,0,800,400);

move();

// attack cooldown
if(p.cd>0) p.cd--;
attack();

// spawn waves
tick++;
if(tick%60===0){
spawn();
}

// update enemies
for(let i=enemies.length-1;i>=0;i--){
enemyAI(enemies[i]);

if(enemies[i].hp<=0){
enemies.splice(i,1);
p.xp+=10;
}
}

// XP + regen
gainXP();

// draw player
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.arc(p.x,p.y,10,0,Math.PI*2);
ctx.fill();

// draw enemies
ctx.fillStyle="red";
for(let e of enemies){
ctx.beginPath();
ctx.arc(e.x,e.y,8,0,Math.PI*2);
ctx.fill();
}

// UI
document.getElementById("hp").innerText=Math.floor(p.hp);
document.getElementById("lvl").innerText=p.lvl;
document.getElementById("xp").innerText=p.xp;

// lose
if(p.hp<=0){
alert("Przegrałeś!");
location.reload();
}

requestAnimationFrame(loop);
}

loop();
</script>
<a href="przegladarkowe.html">⬅ Powrót</a>
</body>
</html>
