<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Arena PRO AI V2</title>

<style>
body{
margin:0;
background:#0b1220;
color:white;
font-family:Arial;
text-align:center;
}

canvas{
background:#111827;
display:block;
margin:auto;
border:2px solid #334155;
}

#ui{
padding:10px;
font-size:18px;
}
</style>
</head>
<body>

<h1>⚔️ Arena PRO AI V2</h1>

<div id="ui">
HP: <span id="hp">100</span> |
AI HP: <span id="ai">100</span> |
Mana: <span id="mana">100</span>
</div>

<canvas id="c" width="800" height="400"></canvas>

<p>WASD = ruch | 1-4 = skille</p>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

// PLAYER
let p={
x:100,y:200,
hp:100,
mana:100,
cd:0
};

// AI
let ai={
x:600,y:200,
hp:100,
cd:0,
dir:1
};

let fireTick=0;

// INPUT
let keys={};

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;

if(e.key==="1") attack();
if(e.key==="2") shield();
if(e.key==="3") dash();
if(e.key==="4") fire();
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// MOVE
function move(){

if(keys["w"]) p.y-=3;
if(keys["s"]) p.y+=3;
if(keys["a"]) p.x-=3;
if(keys["d"]) p.x+=3;

// clamp
p.x=Math.max(20,Math.min(780,p.x));
p.y=Math.max(20,Math.min(380,p.y));
}

// SKILLS

function attack(){

if(distance(p,ai)<60){
ai.hp-=10;
}
}

function shield(){
p.mana-=10;
p.hp+=5;
if(p.hp>100) p.hp=100;
}

function dash(){
p.x+=40;
if(distance(p,ai)<80){
ai.hp-=15;
}
}

function fire(){
if(p.mana<20) return;

p.mana-=20;
ai.fire=3;
ai.fireTimer=180;
}

// AI

function aiLogic(){

let dx=p.x-ai.x;
let dy=p.y-ai.y;

let dist=Math.sqrt(dx*dx+dy*dy);

// chase
ai.x+=dx/dist*1.5;
ai.y+=dy/dist*1.5;

// attack
if(dist<50 && ai.cd<=0){
p.hp-=8;
ai.cd=60;
}

if(ai.cd>0) ai.cd--;

// fire effect
if(ai.fireTimer>0){
ai.fireTimer--;

if(ai.fireTimer%30===0){
ai.hp-=2;
}
}
}

// UTIL

function distance(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}

// LOOP

function loop(){

ctx.clearRect(0,0,800,400);

move();
aiLogic();

// regen mana
p.mana+=0.2;
if(p.mana>100) p.mana=100;

// draw player
ctx.fillStyle="cyan";
ctx.fillRect(p.x,p.y,20,20);

// draw AI
ctx.fillStyle="red";
ctx.fillRect(ai.x,ai.y,20,20);

// win/lose
if(p.hp<=0){
alert("Przegrałeś!");
location.reload();
}

if(ai.hp<=0){
alert("Wygrałeś!");
location.reload();
}

document.getElementById("hp").innerText=Math.floor(p.hp);
document.getElementById("ai").innerText=Math.floor(ai.hp);
document.getElementById("mana").innerText=Math.floor(p.mana);

requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
