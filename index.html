<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteczka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="menu">
    <h1>Biblioteczka</h1>
    <div id="lista"></div>
  </div>

  <script src="teksty.js" charset="UTF-8"></script>
  <script>
    // Pisane w starym JavaScripcie (var, function), bo przeglądarki czytników są proste
    function wczytajPostep(id) {
      try { return localStorage.getItem("postep_" + id); } catch (e) { return null; }
    }

    var lista = document.getElementById("lista");
    var html = "";
    for (var i = 0; i < TEKSTY.length; i++) {
      var t = TEKSTY[i];
      var postep = wczytajPostep(t.id);
      html += '<a class="pozycja" href="czytaj.html?id=' + t.id + '">' +
                '<div class="tytul">' + t.tytul + '</div>' +
                '<div class="opis">' + t.opis + '</div>' +
                (postep ? '<div class="postep">Czytasz: ' + postep + '</div>' : '') +
              '</a>';
    }
    lista.innerHTML = html;
  </script>
</body>
</html>
