<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense</title>
    <link rel="stylesheet" href="towerdefense.css">
</head>
<body>

<header>
    <h1>🏰 Ultimate Tower Defense</h1>
</header>

<div id="topBar">
    <div class="stat">💰 Złoto: <span id="gold">100</span></div>
    <div class="stat">❤️ Życia: <span id="hp">20</span></div>
    <div class="stat">🌊 Fala: <span id="wave">1</span></div>
    <div class="stat">👾 Zabici: <span id="kills">0</span></div>
</div>

<div id="mainLayout">

    <aside id="shop">
        <h2>🛒 Sklep</h2>

        <button class="shopBtn" data-type="archer">🏹 Łucznik<br>50</button>
        <button class="shopBtn" data-type="cannon">💣 Armata<br>120</button>
        <button class="shopBtn" data-type="ice">❄️ Lód<br>100</button>
        <button class="shopBtn" data-type="tesla">⚡ Tesla<br>200</button>
        <button class="shopBtn" data-type="fire">🔥 Ogień<br>250</button>
        <button class="shopBtn" data-type="poison">☠️ Trucizna<br>180</button>
        <button class="shopBtn" data-type="mine">💥 Mina<br>30</button>

        <hr>
        <button id="startWave">▶ Start fali</button>
    </aside>

    <main id="gameArea">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
    </main>

    <aside id="towerPanel">
        <h2>🎯 Info</h2>

        <p>Nazwa: <span id="towerName">-</span></p>
        <p>Poziom: <span id="towerLevel">-</span></p>
        <p>DMG: <span id="towerDamage">-</span></p>
        <p>Zasięg: <span id="towerRange">-</span></p>

        <button id="upgradeBtn">⬆️ Upgrade</button>
        <button id="sellBtn">💰 Sell</button>
    </aside>
    
</div>
<a href="przegladarkowe.html" class="link">Powrót</a>
<script src="towerdefense.js"></script>
</body>
</html>
