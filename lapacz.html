<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Łapacz</title>

<style>
body{
    background:#222;
    color:white;
    text-align:center;
}

#pole{
    width:800px;
    height:500px;
    background:white;
    margin:auto;
    position:relative;
}

#kwadrat{
    width:60px;
    height:60px;
    background:red;
    position:absolute;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>Łapacz</h1>

<p>Punkty: <span id="pkt">0</span></p>

<div id="pole">
    <div id="kwadrat"></div>
</div>

<p><a href="przegladarkowe.html">⬅ Powrót</a></p>

<script>
let pkt = 0;
let k = document.getElementById("kwadrat");

function move(){
    k.style.left = Math.random()*740 + "px";
    k.style.top = Math.random()*440 + "px";
}

k.onclick = () =>{
    pkt++;
    document.getElementById("pkt").innerText = pkt;
    move();
}

move();
</script>

</body>
</html>
