<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧟 Zombie Survival</title>

<style>
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:10px;
}

#ui{
    margin-bottom:10px;
    font-size:20px;
}

canvas{
    border:3px solid #334155;
    background:#1f2937;
}
</style>
</head>
<body>

<h1>🧟 Zombie Survival</h1>

<div id="ui">
❤️ HP: <span id="hp">100</span>
 |
🏆 Punkty: <span id="score">0</span>
 |
🌊 Fala: <span id="wave">1</span>
</div>

<canvas id="game" width="1000" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const playerImg = new Image();
playerImg.src = "ludzik.png";

const keys = {};

let score = 0;
let wave = 1;

let mouseX = 0;
let mouseY = 0;

let canShoot = true;

const bullets = [];
const zombies = [];

const player = {
    x:500,
    y:300,
    width:64,
    height:64,
    speed:4,
    hp:100
};

// ===== STEROWANIE =====

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove",e=>{
    mouseX = e.offsetX;
    mouseY = e.offsetY;
});

// ===== STRZELANIE =====

canvas.addEventListener("click",shoot);

function shoot(){

    if(!canShoot) return;

    canShoot = false;

    setTimeout(()=>{
        canShoot = true;
    },500);

    const startX = player.x + player.width/2;
    const startY = player.y + player.height/2;

    const dx = mouseX - startX;
    const dy = mouseY - startY;

    const dist = Math.hypot(dx,dy);

    bullets.push({
        x:startX,
        y:startY,
        vx:(dx/dist)*10,
        vy:(dy/dist)*10,
        damage:25
    });
}

// ===== ZOMBIE =====

function spawnZombie(){

    let side = Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=0;
        y=Math.random()*600;
    }
    else if(side===1){
        x=1000;
        y=Math.random()*600;
    }
    else if(side===2){
        x=Math.random()*1000;
        y=0;
    }
    else{
        x=Math.random()*1000;
        y=600;
    }

    zombies.push({
        x,
        y,
        hp:1,
        speed:1 + wave*0.05,
        size:40
    });
}

setInterval(spawnZombie,1200);

// ===== UPDATE =====

function updatePlayer(){

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    player.x = Math.max(
        0,
        Math.min(
            canvas.width-player.width,
            player.x
        )
    );

    player.y = Math.max(
        0,
        Math.min(
            canvas.height-player.height,
            player.y
        )
    );
}

function updateZombies(){

    for(let i=zombies.length-1;i>=0;i--){

        const z = zombies[i];

        const dx = player.x - z.x;
        const dy = player.y - z.y;

        const dist = Math.hypot(dx,dy);

        z.x += (dx/dist)*z.speed;
        z.y += (dy/dist)*z.speed;

        if(dist < 40){

            player.hp -= 0.15;

            if(player.hp <= 0){

                alert(
                    "💀 Przegrałeś!\n\nWynik: "
                    + score
                );

                location.reload();
            }
        }
    }
}

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const b = bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        let remove = false;

        for(let j=zombies.length-1;j>=0;j--){

            const z = zombies[j];

            const dist = Math.hypot(
                b.x-z.x,
                b.y-z.y
            );

            if(dist < 25){

                z.hp -= b.damage;

                remove = true;

                if(z.hp <= 0){

                    zombies.splice(j,1);

                    score++;

                    if(score % 10 === 0){

                        wave++;

                    }
                }

                break;
            }
        }

        if(
            remove ||
            b.x < 0 ||
            b.y < 0 ||
            b.x > canvas.width ||
            b.y > canvas.height
        ){
            bullets.splice(i,1);
        }
    }
}

// ===== RYSOWANIE =====

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // gracz

    if(playerImg.complete){

        ctx.drawImage(
            playerImg,
            player.x,
            player.y,
            player.width,
            player.height
        );

    }else{

        ctx.fillStyle="cyan";

        ctx.fillRect(
            player.x,
            player.y,
            player.width,
            player.height
        );
    }

    // zombie

    for(const z of zombies){

        ctx.fillStyle="#22c55e";

        ctx.beginPath();

        ctx.arc(
            z.x,
            z.y,
            z.size/2,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    // pociski

    ctx.fillStyle="yellow";

    for(const b of bullets){

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function updateUI(){

    document.getElementById("hp")
        .textContent =
        Math.floor(player.hp);

    document.getElementById("score")
        .textContent =
        score;

    document.getElementById("wave")
        .textContent =
        wave;
}

function gameLoop(){

    updatePlayer();
    updateZombies();
    updateBullets();

    draw();
    updateUI();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
<p></p>
<a href="przegladarkowe.html">⬅ Powrót</a>
</body>
</html>
